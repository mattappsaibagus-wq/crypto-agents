name: Auto-scan

# Runs the crypto agent pipeline on GitHub's servers, saves the results to
# docs/ (served by GitHub Pages), so the dashboard is reachable from anywhere
# with no Mac running. Trigger manually from the Actions tab on your phone.

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6h at :23
  workflow_dispatch:         # lets you run it on demand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run agents and build static data
        run: python build_static.py
        # Runs the full agent pipeline fresh on each trigger. The agents
        # handle rate-limits gracefully (empty lists, partial reports), so a
        # throttled run still deploys something instead of failing.

      - name: Commit fresh results
        run: |
          git config user.name 'crypto-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || git commit -m 'Update scan results'
          git push

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
