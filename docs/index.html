<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Agent Team</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --yellow: #d29922; --red: #f85149;
    --accent: #58a6ff;
    --accent-dark: #4791d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding: 16px; max-width: 600px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  header { text-align: center; padding: 20px 0 12px; }
  header h1 { font-size: 1.4rem; font-weight: 600; }
  header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    margin: 12px 0; text-align: center; text-decoration: none;
    transition: all 0.2s ease;
    border: none;
    background: var(--accent);
    color: #000;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--surface); border-radius: 8px;
    margin-bottom: 16px; font-size: 0.82rem; color: var(--muted);
  }

  .summary-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .summary-chip {
    flex: 1; text-align: center; padding: 12px 8px; border-radius: 10px;
    font-weight: 700; font-size: 1.1rem;
  }
  .chip-buy { background: rgba(63,185,80,0.15); color: var(--green); }
  .chip-watch { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .chip-avoid { background: rgba(248,81,73,0.15); color: var(--red); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .card:hover {
    background: var(--surface2);
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  .card:active {
    transform: translateY(0);
  }
  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .coin-name { font-weight: 700; font-size: 1.05rem; }
  .action-badge {
    padding: 3px 10px; border-radius: 20px; font-size: 0.75rem;
    font-weight: 700; text-transform: uppercase;
  }
  .badge-buy { background: var(--green); color: #000; }
  .badge-watch { background: var(--yellow); color: #000; }
  .badge-avoid { background: var(--red); color: #fff; }
  .card-details { color: var(--muted); font-size: 0.85rem; }
  .card-details li { margin-bottom: 3px; list-style: none; }
  .card-details li::before { content: "· "; color: var(--accent); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .updated { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 8px; }

  /* Modal styles */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); display: none; align-items: center;
    justify-content: center; z-index: 1000;
  }
  .modal-content {
    background: var(--surface); border-radius: 12px;
    max-width: 90%; width: 400px; max-height: 80vh;
    overflow-y: auto; position: relative;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    animation: modalFadeIn 0.3s ease;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 {
    margin: 0; font-size: 1.25rem; font-weight: 600;
    color: var(--text);
  }
  .modal-close {
    background: none; border: none; font-size: 1.5rem;
    line-height: 1; color: var(--muted); cursor: pointer;
    padding: 4px 8px; border-radius: 4px;
  }
  .modal-close:hover { color: var(--text); background: var(--surface2); }
  .modal-body { padding: 20px; }
  .modal-footer { padding: 16px 20px; text-align: right;
    border-top: 1px solid var(--border); }
  .modal-footer .btn {
    width: auto; margin: 0; margin-left: 8px;
  }
  .coin-chart-placeholder {
    width: 100%; height: 200px; background: var(--surface2);
    border-radius: 8px; margin: 16px 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>⚡ Crypto Agent Team</h1>
  <p id="lastRun">Loading...</p>
</header>

<div class="status-bar">
  <span>🤖 Auto-scan every 6h on GitHub</span>
  <span id="signalCount"></span>
</div>

<a class="btn btn-primary" id="runBtn">▶ Run Full Scan Now</a>
<p style="text-align:center;color:var(--muted);fontize:0.75rem;margin-top:-8px">
  Triggers a scan via GitHub Actions (check the Actions tab for progress)
</p>

<div class="summary-row" id="summaryRow" style="display:none">
  <div class="summary-chip chip-buy" id="buyCount">0<br><small>BUY</small></div>
  <div class="summary-chip chip-watch" id="watchCount">0<br><small>WATCH</small></div>
  <div class="summary-chip chip-avoid" id="avoidCount">0<br><small>AVOID</small></div>
</div>

<div id="cards"><div class="empty">No report yet</div></div>

<div class="updated" id="updated"></div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content" id="modalContent">
    <div class="modal-header">
      <h2 id="modalTitle">Modal Title</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody">
      Modal body content
    </div>
    <div class="modal-footer" id="modalFooter">
      <!-- Buttons will be inserted here -->
    </div>
  </div>
</div>

<script>
async function loadData() {
  try {
    const r = await fetch('data.json', { cache: 'no-store' });
    const data = await r.json();

    if (data.timestamp) {
      document.getElementById('lastRun').textContent =
        'Last scan: ' + new Date(data.timestamp).toLocaleString();
    }

    // Trigger button → GitHub Actions workflow dispatch (opens in same tab)
    const runBtn = document.getElementById('runBtn');
    runBtn.href = data.workflow_url || '#';
    runBtn.target = '_self'; // Open in same tab
    runBtn.removeAttribute('rel'); // Remove noopener if not needed
    document.getElementById('signalCount').textContent = data.signals + ' signals';
    document.getElementById('updated').textContent =
      'Updated by GitHub Actions · ' + new Date().toLocaleString();

    const cards = data.cards || [];
    let buy=0, watch=0, avoid=0;
    cards.forEach(c => {
      if (c.action==='BUY') buy++;
      else if (c.action==='WATCH') watch++;
      else avoid++;
    });

    if (cards.length) {
      document.getElementById('summaryRow').style.display = 'flex';
      document.getElementById('buyCount').innerHTML = buy + '<br><small>BUY</small>';
      document.getElementById('watchCount').innerHTML = watch + '<br><small>WATCH</small>';
      document.getElementById('avoidCount').innerHTML = avoid + '<br><small>AVOID</small>';
    }

    let html = '';
    cards.forEach((c, index) => {
      const badgeClass = c.action === 'BUY' ? 'badge-buy' : c.action === 'AVOID' ? 'badge-avoid' : 'badge-watch';
      const details = (c.details||[]).map(d => '<li>' + d + '</li>').join('');
      html += '<div class="card" data-index="' + index + '">' +
        '<div class="card-header">' +
          '<span class="coin-name">' + c.coin + '</span>' +
          '<span class="action-badge ' + badgeClass + '">' + c.action + '</span>' +
        '</div>' +
        '<ul class="card-details">' + details + '</ul>' +
      '</div>';
    });
    document.getElementById('cards').innerHTML = html || '<div class="empty">No results</div>';

    // Add click listeners to cards
    document.querySelectorAll('#cards .card').forEach(card => {
      card.addEventListener('click', function() {
        const index = this.getAttribute('data-index');
        const coin = cards[index];
        showCoinModal(coin);
      });
    });

  } catch(e) {
    document.getElementById('cards').innerHTML = '<div class="empty">Failed to load report</div>';
  }
}

// Modal functions
const modalOverlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modalFooter = document.getElementById('modalFooter');
const modalClose = document.getElementById('modalClose');

function openModal(title, bodyHtml, footerButtons = '') {
  modalTitle.textContent = title;
  modalBody.innerHTML = bodyHtml;
  modalFooter.innerHTML = footerButtons;
  modalOverlay.style.display = 'flex';
}

function closeModal() {
  modalOverlay.style.display = 'none';
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', function(e) {
  if (e.target === modalOverlay) closeModal();
});

function showCoinModal(coin) {
  const detailsList = (coin.details||[]).map(d => '<li>' + d + '</li>').join('');
  const body = `
    <p><strong>Coin:</strong> ${coin.coin}</p>
    <p><strong>Action:</strong> <span class="action-badge ${coin.action === 'BUY' ? 'badge-buy' : coin.action === 'AVOID' ? 'badge-avoid' : 'badge-watch'}">${coin.action}</span></p>
    <ul class="card-details">${detailsList}</ul>
    <div class="coin-chart-placeholder">
      Charts (15m, 1h, 4h, 1week) coming soon
    </div>
  `;
  const footer = `
    <button class="btn btn-primary" id="modalCloseBtn">Close</button>
  `;
  openModal(`${coin.coin} Details`, body, footer);
  // Add event listener to the close button in the modal
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
}

function showScanModal() {
  const body = `
    <p>The scan has been triggered via GitHub Actions.</p>
    <p>Check the <a href="https://github.com/mattappsaibagus-wq/crypto-agents/actions" target="_blank" rel="noopener">Actions tab</a> for progress and results.</p>
    <p>Once the scan completes, the data will update automatically.</p>
  `;
  const footer = `
    <button class="btn btn-primary" id="scanModalCloseBtn">OK</button>
  `;
  openModal('Scan Triggered', body, footer);
  document.getElementById('scanModalCloseBtn').addEventListener('click', closeModal);
}

// Scan button click handler
document.getElementById('runBtn').addEventListener('click', function(e) {
  e.preventDefault(); // Prevent navigation
  showScanModal();
});

// Initial load
loadData();
</script>
</body>
</html>
